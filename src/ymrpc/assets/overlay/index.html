<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YMRPC Next — Now Playing</title>
<style>
  :root {
    --accent: #ffcc00;
    --bg: rgba(17, 18, 22, .88);
    --bg-2: rgba(28, 30, 36, .72);
    --fg: #f7f7f8;
    --muted: #9b9ea8;
    --line: rgba(255, 255, 255, .09);
    --shadow: 0 18px 50px rgba(0, 0, 0, .45);
    --radius: 18px;
  }
  html[data-theme="light"] {
    --bg: rgba(255, 255, 255, .9);
    --bg-2: rgba(244, 244, 247, .8);
    --fg: #16171b;
    --muted: #6e727c;
    --line: rgba(0, 0, 0, .08);
    --shadow: 0 18px 45px rgba(20, 20, 30, .18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    font-family: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    color: var(--fg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: relative;
    display: flex;
    gap: 16px;
    align-items: center;
    width: 100%;
    max-width: 520px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: linear-gradient(135deg, var(--bg), var(--bg-2));
    box-shadow: var(--shadow);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    overflow: hidden;
    transition: opacity .45s ease, transform .45s ease;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: -40%;
    background: radial-gradient(circle at 12% 18%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 45%);
    pointer-events: none;
    opacity: .9;
  }
  .art-wrap {
    position: relative;
    flex: 0 0 112px;
    width: 112px;
    height: 112px;
    border-radius: 14px;
    overflow: hidden;
    background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 42%, #222), #1a1b20);
    box-shadow: 0 10px 24px rgba(0,0,0,.35);
  }
  .art-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transform: scale(1.04);
    transition: opacity .5s ease, transform .6s ease;
  }
  .art-wrap img.loaded { opacity: 1; transform: scale(1); }
  .art-fallback {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; color: rgba(255,255,255,.7);
  }
  .main { position: relative; flex: 1 1 auto; min-width: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .source {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .eq { display: flex; align-items: flex-end; gap: 2px; height: 14px; opacity: .9; }
  .eq i { display: block; width: 3px; height: 4px; border-radius: 2px; background: var(--accent); animation: bounce 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: .15s; }
  .eq i:nth-child(3) { animation-delay: .3s; }
  .eq i:nth-child(4) { animation-delay: .45s; }
  body.paused .eq i { animation-play-state: paused; height: 4px; opacity: .4; }
  @keyframes bounce { 0%,100% { height: 4px; } 50% { height: 14px; } }
  .title {
    font-size: 21px; font-weight: 700; line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .artist { font-size: 14px; color: var(--fg); opacity: .82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .album { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress { margin-top: 12px; }
  .bar { height: 3px; border-radius: 99px; background: color-mix(in srgb, var(--fg) 12%, transparent); overflow: hidden; }
  .fill {
    height: 100%; width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, #fff), var(--accent));
    box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 60%, transparent);
    transition: width .35s linear;
  }
  .times { display: flex; justify-content: space-between; margin-top: 5px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  body.idle:not([data-idle="show"]) .card { opacity: 0; transform: translateY(4px) scale(.985); pointer-events: none; }
  body.idle .eq i { animation: none; height: 4px; opacity: .35; }
  body.idle .title { color: var(--muted); }
  body.compact .card { max-width: 400px; padding: 12px; gap: 12px; border-radius: 15px; }
  body.compact .art-wrap { flex-basis: 68px; width: 68px; height: 68px; border-radius: 10px; }
  body.compact .title { font-size: 16px; }
  body.compact .artist { font-size: 12px; }
  body.compact .album, body.compact .progress { display: none; }
  body.hide-album .album, body.hide-source .source, body.hide-progress .progress,
  body.hide-time .times, body.hide-cover .art-wrap { display: none; }
  body.hide-cover .card { max-width: 520px; }
</style>
</head>
<body data-idle="hide">
<div class="card" id="card">
  <div class="art-wrap">
    <img id="art" alt="">
    <div class="art-fallback">♪</div>
  </div>
  <div class="main">
    <div class="top">
      <div class="source"><span class="dot"></span><span id="source">YMRPC Next</span></div>
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="title" id="title">Ничего не играет</div>
    <div class="artist" id="artist">Включи музыку</div>
    <div class="album" id="album"></div>
    <div class="progress">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    </div>
  </div>
</div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const widget = location.pathname === "/widget";
  const compact = widget || params.get("compact") === "1";
  const theme = params.get("theme") || "dark";
  const accent = params.get("accent");
  const idle = params.get("idle") || "hide";
  const allowedHide = new Set(["album", "source", "progress", "time", "cover"]);
  document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
  document.body.dataset.idle = idle === "show" ? "show" : "hide";
  if (accent && /^#[0-9a-fA-F]{6}$/.test(accent)) {
    document.documentElement.style.setProperty("--accent", accent);
  }
  if (compact) document.body.classList.add("compact");
  for (const item of (params.get("hide") || "").split(",")) {
    const name = item.trim().toLowerCase();
    if (allowedHide.has(name)) document.body.classList.add("hide-" + name);
  }

  const $ = (id) => document.getElementById(id);
  const art = $("art"), title = $("title"), artist = $("artist"), album = $("album"),
        source = $("source"), fill = $("fill"), pos = $("pos"), dur = $("dur");

  let playing = false, basePosition = 0, baseAt = 0, duration = 0, hasTrack = false;

  const fmt = (value) => {
    if (!Number.isFinite(value) || value < 0) value = 0;
    const seconds = Math.floor(value % 60);
    const minutes = Math.floor((value / 60) % 60);
    const hours = Math.floor(value / 3600);
    return hours ? `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`
                 : `${minutes}:${String(seconds).padStart(2, "0")}`;
  };

  function safeArtUrl(value) {
    if (!value) return null;
    try {
      const url = new URL(value, location.origin);
      if (url.origin !== location.origin || url.pathname !== "/api/art") return null;
      return url.pathname + url.search;
    } catch (_) {
      return null;
    }
  }

  function setArt(url) {
    url = safeArtUrl(url);
    if (!url) { art.classList.remove("loaded"); art.removeAttribute("src"); return; }
    if (art.dataset.url === url) return;
    art.dataset.url = url;
    art.classList.remove("loaded");
    art.onload = () => art.classList.add("loaded");
    art.onerror = () => art.classList.remove("loaded");
    art.src = url;
  }

  function apply(data) {
    hasTrack = !!data.has_track;
    document.body.classList.toggle("idle", !hasTrack);
    document.body.classList.toggle("paused", data.status === "paused");
    if (!hasTrack) {
      title.textContent = "Ничего не играет";
      artist.textContent = "Включи музыку";
      album.textContent = "";
      setArt(null);
      fill.style.width = "0%";
      pos.textContent = "0:00"; dur.textContent = "0:00";
      return;
    }
    title.textContent = data.title || "Неизвестный трек";
    artist.textContent = data.artist || "Неизвестный исполнитель";
    album.textContent = data.album || "";
    source.textContent = data.source || "YMRPC Next";
    document.title = `${data.title || "YMRPC Next"} — ${data.artist || ""}`;
    setArt(data.art_url || null);
    duration = Number(data.duration) || 0;
    basePosition = Number(data.position) || 0;
    baseAt = performance.now();
    playing = data.status === "playing";
    dur.textContent = fmt(duration);
  }

  function tick(now) {
    if (hasTrack) {
      const current = playing ? Math.min(duration || Infinity, basePosition + (now - baseAt) / 1000) : basePosition;
      const percent = duration > 0 ? Math.min(100, (current / duration) * 100) : 0;
      fill.style.width = percent.toFixed(2) + "%";
      pos.textContent = fmt(current);
    }
    requestAnimationFrame(tick);
  }

  function connect() {
    if (!window.EventSource) { poll(); return; }
    const events = new EventSource("/events");
    events.onmessage = (event) => {
      try { apply(JSON.parse(event.data)); } catch (_) {}
    };
    events.onerror = () => { /* EventSource переподключится сам */ };
  }

  function poll() {
    fetch("/api/now-playing", { cache: "no-store" })
      .then((response) => response.json())
      .then(apply)
      .catch(() => {});
    setTimeout(poll, 2000);
  }

  fetch("/api/now-playing", { cache: "no-store" }).then((response) => response.json()).then(apply).catch(() => {});
  connect();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
