[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ymrpc-next"
version = "0.1.0"
description = "YMRPC Next — музыка из любого плеера в статусе Discord"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "YMRPC Next contributors" }]
dependencies = [
    "PySide6>=6.8",
    "PySide6-WebEngine>=6.8",
    "httpx>=0.27",
    "aiohttp>=3.10",
    "Pillow>=10",
    "yandex-music==2.2.0",
    "winrt-runtime==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media.Control==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams==3.2.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7", "pyinstaller>=6.10"]

[project.scripts]
ymrpc = "ymrpc.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ymrpc = ["assets/*.ico", "assets/*.png", "assets/overlay/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
